{% extends "base.html" %}

{% block content %}

<div class="add-word-page">

    <div class="page-header">

        <a
            href="{% url 'vocabulary_set_detail' set_id=vocabulary_set.id %}"
            class="back-link"
        >
            ← Back to {{ vocabulary_set.name }}
        </a>

        <span class="eyebrow">
            VOCABULARY SET
        </span>

        <h1>Add a Word</h1>

        <p>
            Add a new vocabulary word to
            <strong>{{ vocabulary_set.name }}</strong>.
        </p>

    </div>


    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}


    <form method="post" class="word-form">

        {% csrf_token %}


        <!-- WORD -->

        <div class="form-group">

            <label for="word">
                Word <span>*</span>
            </label>

            <input
                type="text"
                id="word"
                name="word"
                value="{{ word|default:'' }}"
                placeholder="e.g. fascinating"
                required
                autofocus
            >

        </div>


        <!-- TRANSLATION -->

        <div class="form-group">

            <label for="translation">
                Uzbek translation <span>*</span>
            </label>

            <input
                type="text"
                id="translation"
                name="translation"
                value="{{ translation|default:'' }}"
                placeholder="e.g. hayratlanarli"
                required
            >

        </div>


        <!-- DEFINITION -->

        <div class="form-group">

            <label for="definition">
                Definition <span>*</span>
            </label>

            <textarea
                id="definition"
                name="definition"
                rows="4"
                placeholder="Explain the meaning of the word in English..."
                required
            >{{ definition|default:'' }}</textarea>

        </div>


        <!-- PRONUNCIATION -->

        <div class="form-group">

            <label for="pronunciation">
                Pronunciation
                <small>Optional</small>
            </label>

            <input
                type="text"
                id="pronunciation"
                name="pronunciation"
                value="{{ pronunciation|default:'' }}"
                placeholder="e.g. /ˈfæsɪneɪtɪŋ/"
            >

        </div>


        <!-- EXAMPLE -->

        <div class="form-group">

            <label for="example">
                Example
                <small>Optional</small>
            </label>

            <textarea
                id="example"
                name="example"
                rows="3"
                placeholder="Write an example sentence..."
            >{{ example|default:'' }}</textarea>

        </div>


        <!-- SYNONYMS -->

        <div class="form-group">

            <label for="synonyms">
                Synonyms
                <small>Optional</small>
            </label>

            <input
                type="text"
                id="synonyms"
                name="synonyms"
                value="{{ synonyms|default:'' }}"
                placeholder="e.g. amazing, intriguing, captivating"
            >

        </div>


        <!-- LEVEL + CATEGORY -->

        <div class="form-row">

            <div class="form-group">

                <label for="level">
                    Level
                </label>

                <select
                    id="level"
                    name="level"
                >

                    {% for item_level in levels %}

                        <option
                            value="{{ item_level }}"
                            {% if level == item_level %}
                                selected
                            {% elif not level and item_level == "B1" %}
                                selected
                            {% endif %}
                        >
                            {{ item_level }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                    <small>Optional</small>
                </label>

                <input
                    type="text"
                    id="category"
                    name="category"
                    value="{{ category|default:'' }}"
                    placeholder="e.g. Education"
                >

            </div>

        </div>


        <!-- ACTIONS -->

        <div class="form-actions">

            <a
                href="{% url 'vocabulary_set_detail' set_id=vocabulary_set.id %}"
                class="cancel-button"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="submit-button"
            >
                + Add Word
            </button>

        </div>

    </form>

</div>


<style>

.add-word-page {
    max-width: 820px;
    margin: 0 auto;
    padding: 45px 24px 80px;
}


.page-header {
    margin-bottom: 30px;
}


.back-link {
    display: inline-block;
    margin-bottom: 28px;
    color: inherit;
    text-decoration: none;
    font-size: 13px;
    opacity: .6;
}


.back-link:hover {
    opacity: 1;
}


.eyebrow {
    display: block;
    margin-bottom: 8px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    opacity: .5;
}


.page-header h1 {
    margin: 0 0 8px;
    font-size: 38px;
    line-height: 1.15;
}


.page-header p {
    margin: 0;
    line-height: 1.6;
    opacity: .65;
}


.word-form {
    padding: 28px;
    border: 1px solid rgba(128,128,128,.2);
    border-radius: 20px;
    background: rgba(128,128,128,.035);
}


.form-group {
    margin-bottom: 22px;
}


.form-group label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 700;
}


.form-group label span {
    color: #dc2626;
}


.form-group label small {
    margin-left: 5px;
    font-weight: 500;
    opacity: .5;
}


.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid rgba(128,128,128,.25);
    border-radius: 11px;
    padding: 12px 14px;
    background: transparent;
    color: inherit;
    font: inherit;
    outline: none;
    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}


.form-group input,
.form-group select {
    height: 46px;
}


.form-group textarea {
    resize: vertical;
    min-height: 100px;
    line-height: 1.5;
}


.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color: #111827;
    box-shadow: 0 0 0 3px rgba(17,24,39,.08);
}


.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}


.error-message {
    margin-bottom: 20px;
    padding: 13px 15px;
    border: 1px solid rgba(220,38,38,.25);
    border-radius: 11px;
    background: rgba(220,38,38,.08);
    color: #b91c1c;
    font-size: 13px;
    font-weight: 600;
}


.form-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px solid rgba(128,128,128,.15);
}


.cancel-button,
.submit-button {
    min-height: 44px;
    padding: 10px 18px;
    border-radius: 11px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
}


.cancel-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(128,128,128,.25);
    color: inherit;
}


.submit-button {
    border: 1px solid #111827;
    background: #111827;
    color: #fff;
}


.cancel-button:hover {
    background: rgba(128,128,128,.08);
}


.submit-button:hover {
    opacity: .92;
}


@media (max-width: 650px) {

    .add-word-page {
        padding: 25px 16px 50px;
    }

    .page-header h1 {
        font-size: 32px;
    }

    .word-form {
        padding: 20px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .form-actions {
        flex-direction: column-reverse;
        align-items: stretch;
    }

    .cancel-button,
    .submit-button {
        width: 100%;
        box-sizing: border-box;
        text-align: center;
    }

}

</style>

{% endblock %}
